<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>修辭小偵探・南一六上</title>
<meta name="description" content="南一版六上第一～十二課修辭複習：修辭教室、修辭總整理、闖關遊戲和修辭公仔圖鑑，例句與題目皆為原創，平板和電腦都能玩。">
<meta property="og:title" content="修辭小偵探・南一六上">
<meta property="og:description" content="南一版六上第一～十二課修辭複習：修辭教室、修辭總整理、闖關遊戲和修辭公仔圖鑑，例句與題目皆為原創，平板和電腦都能玩。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='10' fill='white' stroke='%23cc3329' stroke-width='6'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23cc3329' font-family='serif'%3E%E4%BF%AE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 一本國語作業簿（淺色）／教室黑板（深色）。單欄、平板優先，上方分頁，紅筆批改當作回饋語言。 */
:root{
  --paper:#f6faf5; --grid:#d5e7d8; --card:#ffffff; --ink:#1e2b33; --muted:#5a6a6c;
  --line:#d6e2d8; --red:#cc3329; --red-soft:rgba(204,51,41,.10); --green:#2c7a57; --green-soft:rgba(44,122,87,.10);
  --ok:#2c7a57; --gold:#c98a12; --shadow:0 1px 0 rgba(30,43,51,.06),0 6px 18px -10px rgba(30,43,51,.25);
  --f-kai:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC","STKaiti",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1d362d; --grid:#264337; --card:#24443a; --ink:#eef3ea; --muted:#a8c0b3;
  --line:#3a5d50; --red:#ff8a7a; --red-soft:rgba(255,138,122,.14); --green:#8fd8b0; --green-soft:rgba(143,216,176,.14);
  --ok:#8fd8b0; --gold:#f2c35b; --shadow:0 6px 18px -10px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#1d362d; --grid:#264337; --card:#24443a; --ink:#eef3ea; --muted:#a8c0b3;
  --line:#3a5d50; --red:#ff8a7a; --red-soft:rgba(255,138,122,.14); --green:#8fd8b0; --green-soft:rgba(143,216,176,.14);
  --ok:#8fd8b0; --gold:#f2c35b; --shadow:0 6px 18px -10px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px; background-position:-1px -1px;
  color:var(--ink); font-family:var(--f-ui); font-size:17px; line-height:1.6;
  padding-inline:16px; padding-block:0 48px;
}
.wrap{max-width:860px; margin:0 auto}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--green); outline-offset:2px}

/* header */
header.cover{padding-block:22px 10px; display:flex; gap:14px 20px; align-items:flex-start; justify-content:space-between}
.title-block{min-width:0}
.head-right{display:flex; gap:16px; align-items:flex-end; flex:none}
.qr{margin:0; display:grid; justify-items:center; gap:4px; background:#fff; border:2px solid var(--red); border-radius:12px; padding:8px 8px 6px}
.qr #qrImg svg{display:block; width:96px; height:96px}
.qr figcaption{font-size:12px; font-weight:700; color:#cc3329; white-space:nowrap}
@media (max-width:640px){
  header.cover{gap:10px}
  .title-block{gap:10px}
  .title-block .seal{width:44px; height:44px; font-size:24px}
  .qr #qrImg svg{width:72px; height:72px}
  .namebox{gap:8px; font-size:15px}
  .namebox span{min-width:3em}
}
.namebox{white-space:nowrap}
.title-block{display:flex; align-items:center; gap:14px}
.seal{display:inline-grid; place-items:center; width:54px; height:54px; border:3px solid var(--red); color:var(--red);
  border-radius:8px; font-family:var(--f-kai); font-weight:700; font-size:30px; line-height:1; transform:rotate(-4deg); background:var(--card)}
h1{font-family:var(--f-kai); font-size:clamp(30px,6vw,42px); margin:0; letter-spacing:.06em; line-height:1.15}
.sub{margin:2px 0 0; color:var(--muted); font-size:15px}
.namebox{font-family:var(--f-kai); font-size:16px; color:var(--muted); display:flex; gap:14px}
.namebox span{border-bottom:1.5px solid var(--muted); padding:0 4px; min-width:4.2em; display:inline-block}

nav.tabs{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; gap:8px; padding-block:10px;
  background:linear-gradient(var(--paper) 80%,transparent)}
.tab{flex:1; border:2px solid var(--line); background:var(--card); border-radius:999px; padding:10px 8px; font-weight:700; font-size:17px}
.tab[aria-selected="true"]{border-color:var(--green); background:var(--green); color:var(--card)}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#14271f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#14271f}}

section.panel{display:grid; gap:18px; padding-top:8px}
h2{font-family:var(--f-kai); font-size:26px; margin:0; text-wrap:balance}
h3{font-family:var(--f-kai); font-size:23px; margin:0}
.lead{margin:0; color:var(--muted)}
.box{background:var(--card); border:1.5px solid var(--line); border-radius:var(--r); padding:18px; box-shadow:var(--shadow); min-width:0}

/* chips */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:2px solid var(--line); background:var(--card); border-radius:999px; padding:7px 14px; font-weight:500; font-size:16px; min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--red); color:var(--red); background:var(--red-soft); font-weight:700}

/* matrix */
.matrix-scroll{overflow-x:auto}
table.matrix{border-collapse:collapse; width:100%; min-width:560px; font-variant-numeric:tabular-nums}
.matrix th,.matrix td{border:1px solid var(--line); text-align:center; padding:8px 4px; font-size:15px}
.matrix thead th{font-family:var(--f-kai); font-size:17px}
.matrix tbody th{font-family:var(--f-kai); white-space:nowrap; padding-inline:10px; text-align:left}
.dot{display:inline-block; width:14px; height:14px; border-radius:50%; border:2.5px solid var(--red)}
.matrix tr.dim{opacity:.35}

/* rhetoric cards */
.cards{display:grid; gap:14px}
.rcard{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; align-items:start}
.rcard .seal{width:58px; height:58px; font-size:32px; grid-row:span 3}
.rcard h3 small{font-family:var(--f-ui); font-size:14px; color:var(--muted); font-weight:500; margin-left:8px}
.def{margin:0}
.tip{margin:0; color:var(--green); font-weight:500}
.tip::before{content:"判斷小撇步："; font-weight:700}
.ex-list{grid-column:1/-1; list-style:none; margin:8px 0 0; padding:0; display:grid; gap:8px}
.ex-list li{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:baseline; padding:10px 12px; border-radius:10px; background:var(--green-soft); min-width:0}
.ex-list li.dim{opacity:.35}
.ltag{font-size:13px; font-weight:700; color:var(--green); border:1.5px solid var(--green); border-radius:6px; padding:0 6px; white-space:nowrap}
.ex-s{font-family:var(--f-kai); font-size:19px; min-width:0}
.ex-n{display:block; font-family:var(--f-ui); font-size:14px; color:var(--muted)}
mark.hl{background:none; color:inherit; text-decoration:underline; text-decoration-color:var(--red); text-decoration-thickness:3px; text-underline-offset:6px; font-weight:700}
.note{grid-column:1/-1; margin:6px 0 0; font-size:15px; color:var(--muted)}

.confuse{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px}
.confuse div{border:1.5px dashed var(--line); border-radius:12px; padding:12px 14px; min-width:0}
.confuse b{font-family:var(--f-kai); font-size:19px; display:block}
.confuse p{margin:4px 0 0; font-size:15px}

/* game setup */
.setup{display:grid; gap:16px}
.setup label.lbl{font-weight:700; display:block; margin-bottom:6px}
.big-btn{border:none; background:var(--red); color:#fff; border-radius:999px; padding:14px 28px; font-size:20px; font-weight:700; min-height:56px; box-shadow:0 4px 0 rgba(0,0,0,.18)}
.big-btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.18)}
.ghost-btn{border:2px solid var(--line); background:var(--card); border-radius:999px; padding:12px 22px; font-size:17px; font-weight:700; min-height:52px}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.best{color:var(--muted); font-size:15px}

/* play */
.hud{display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center}
.grades{display:flex; gap:4px; flex-wrap:wrap}
.grades i{width:30px; height:30px; border:1.5px solid var(--grid); background:var(--card); display:grid; place-items:center;
  font-style:normal; font-family:var(--f-kai); font-weight:700; color:var(--red); font-size:20px; position:relative}
.grades i::before,.grades i::after{content:""; position:absolute; background:var(--grid)}
.grades i::before{left:50%; top:0; bottom:0; width:1px; opacity:.6}
.grades i::after{top:50%; left:0; right:0; height:1px; opacity:.6}
.grades i span{position:relative; z-index:1}
.grades i.now{border-color:var(--red); border-width:2px}
.combo{font-weight:700; color:var(--gold); min-height:1.6em}
.qbox{display:grid; gap:16px}
.qkind{font-size:15px; color:var(--muted); font-weight:700}
.qsent{font-family:var(--f-kai); font-size:clamp(23px,4.4vw,30px); line-height:1.75; margin:0}
.qsrc{font-size:14px; color:var(--muted)}
.opts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.opts.long{grid-template-columns:1fr}
.opt{border:2.5px solid var(--line); background:var(--card); border-radius:14px; padding:14px 12px; min-height:64px;
  font-family:var(--f-kai); font-size:24px; font-weight:700; text-align:center; transition:transform .12s, border-color .12s}
.opts.long .opt{font-size:20px; text-align:left; font-weight:400; line-height:1.6; padding:14px 16px}
.opt:hover{border-color:var(--green)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok); background:var(--green-soft)}
.opt.wrong{border-color:var(--red); background:var(--red-soft)}
.opt.fade{opacity:.45}
.feedback{border-radius:12px; padding:14px 16px; display:grid; gap:4px}
.feedback.good{background:var(--green-soft)}
.feedback.bad{background:var(--red-soft)}
.feedback strong{font-family:var(--f-kai); font-size:23px}
.feedback.good strong{color:var(--ok)} .feedback.bad strong{color:var(--red)}
.feedback p{margin:0}
.next-row{display:flex; justify-content:flex-end}

/* result */
.score-line{display:flex; flex-wrap:wrap; align-items:center; gap:12px 22px}
.score{font-family:var(--f-kai); font-size:64px; line-height:1; color:var(--red); font-weight:700; font-variant-numeric:tabular-nums}
.score small{font-size:26px; color:var(--muted)}
.stars{font-size:38px; letter-spacing:4px; color:var(--gold)}
.stars .off{color:var(--line)}
.stamp-card{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px}
.stamp{display:grid; justify-items:center; gap:4px; font-size:14px; color:var(--muted)}
.stamp .seal{width:52px; height:52px; font-size:28px; border-style:dashed; color:var(--line); border-color:var(--line); background:transparent; transform:none}
.stamp.got .seal{border-style:solid; color:var(--red); border-color:var(--red); background:var(--card); transform:rotate(-6deg)}
.stamp.got{color:var(--ink)}
.stamp.new .seal{animation:press .5s ease-out}
@keyframes press{0%{transform:scale(1.8) rotate(-6deg); opacity:0} 60%{transform:scale(.92) rotate(-6deg); opacity:1} 100%{transform:scale(1) rotate(-6deg)}}
.wrong-list{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.wrong-list li{border-left:4px solid var(--red); padding:8px 12px; background:var(--red-soft); border-radius:0 10px 10px 0}
.wrong-list .ex-s{display:block}
.wrong-list p{margin:4px 0 0; font-size:15px}
.empty{color:var(--muted); margin:0}
.toolbar{display:flex; justify-content:flex-end; gap:8px}
.icon-btn{border:2px solid var(--line); background:var(--card); border-radius:999px; padding:6px 14px; font-size:15px; min-height:40px}

/* 修辭教室 */
.units{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px}
@media (max-width:640px){.units{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prows{display:grid; gap:8px}
.prows div{display:grid; grid-template-columns:minmax(0,1.3fr) auto minmax(0,1.6fr); gap:10px; align-items:center; font-family:var(--f-kai); font-size:22px}
.prows span{border:2px solid var(--line); border-radius:10px; padding:6px 12px; background:var(--card)}
.prows b{color:var(--red); background:var(--red-soft); border-radius:8px; padding:4px 10px}
.unit{display:grid; justify-items:center; gap:6px; padding:16px 10px; border:2px solid var(--line); background:var(--card); border-radius:var(--r); min-height:140px}
.unit:hover{border-color:var(--green)}
.unit .seal{width:56px; height:56px; font-size:30px}
.unit .uname{font-family:var(--f-kai); font-size:22px; font-weight:700}
.unit .ustate{font-size:14px; color:var(--muted); font-weight:500}
.unit.done{border-color:var(--ok); background:var(--green-soft)}
.unit.done .ustate{color:var(--ok); font-weight:700}
.unit-box{display:grid; gap:16px}
.unit-head{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between}
.unit-title{display:flex; align-items:center; gap:12px}
.unit-title .seal{width:50px; height:50px; font-size:28px}
.unit-title h2{font-size:30px}
.ghost-btn.small{padding:6px 14px; min-height:42px; font-size:15px}
.steps{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px}
.steps li{display:flex; align-items:center; gap:6px; font-size:14px; color:var(--muted); padding:8px 6px; border-bottom:3px solid var(--line); min-width:0}
.steps li span{flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; border:2px solid var(--line); font-weight:700; font-size:13px}
.steps li.past{color:var(--ok); border-color:var(--ok)} .steps li.past span{border-color:var(--ok)}
.steps li.on{color:var(--red); border-color:var(--red); font-weight:700} .steps li.on span{border-color:var(--red); background:var(--red); color:#fff}
.unit-body{display:grid; gap:14px; min-width:0}
.big-intro{font-family:var(--f-kai); font-size:clamp(22px,4vw,27px); line-height:1.7; margin:0}
.senses{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px}
.senses div{border:1.5px solid var(--line); border-radius:12px; padding:10px 4px; text-align:center; display:grid; gap:2px}
.senses b{font-family:var(--f-kai); font-size:20px}
.senses span{font-size:13px; color:var(--muted)}
.pair{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; text-align:center}
.pair .pa,.pair .pb{font-family:var(--f-kai); font-size:21px; font-weight:700; border:2px solid var(--line); border-radius:12px; padding:12px 8px}
.pair .pb{border-color:var(--red); color:var(--red)}
.pair .parrow{font-size:14px; color:var(--muted); font-weight:700}
.pair .parrow::after{content:" ➜"}
.pair p{grid-column:1/-1; margin:0; color:var(--green); font-weight:500}
.chain{display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-family:var(--f-kai); font-size:23px}
.chain > span:not(.carrow){border:2px solid var(--line); border-radius:12px; padding:6px 12px}
.chain b{color:var(--red); background:var(--red-soft); border-radius:6px; padding:0 4px}
.carrow{color:var(--muted)}
.compare{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px}
.cmp{border-radius:12px; padding:12px 14px; display:grid; gap:6px; align-content:start; min-width:0}
.cmp.plain{border:1.5px dashed var(--line)}
.cmp.plain .ex-s{color:var(--muted)}
.cmp.rich{background:var(--green-soft); border:1.5px solid var(--green)}
.cmp .ex-s{margin:0}
.cmp .ltag{justify-self:start}
.cl{font-size:13px; font-weight:700; color:var(--muted)}
.cmp.rich .cl{color:var(--green)}
.why{margin:0; padding:12px 14px; border-left:4px solid var(--gold); background:var(--card); border-radius:0 10px 10px 0}
.why b{display:block; font-family:var(--f-kai); font-size:19px}
.ltag.extra{color:var(--gold); border-color:var(--gold)}
.ex-list li.xli{background:transparent; border:1.5px dashed var(--line)}
.mini{display:grid; gap:10px; padding:14px; border:1.5px solid var(--line); border-radius:12px}
.mq{margin:0; font-weight:700; font-size:18px}
.mopts{display:grid; gap:8px}
.mopt{text-align:left; border:2px solid var(--line); background:var(--card); border-radius:12px; padding:12px 14px; font-family:var(--f-kai); font-size:20px; min-height:52px}
.mopt:hover{border-color:var(--green)}
.mopt.right{border-color:var(--ok); background:var(--green-soft)}
.mopt.wrong{border-color:var(--red); background:var(--red-soft)}
.mopt:disabled{cursor:default}
.mfb{margin:0; font-weight:500}
.mfb.good{color:var(--ok)} .mfb.bad{color:var(--red)}
.big-btn:disabled{opacity:.5; cursor:not-allowed}
@media (max-width:520px){
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .senses{grid-template-columns:repeat(3,minmax(0,1fr))}
}

@media (max-width:520px){
  body{font-size:16px}
  .opts{grid-template-columns:1fr 1fr}
  .opt{font-size:21px}
  .stamp-card{grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px}
  .stamp .seal{width:44px; height:44px; font-size:24px}
  .rcard{grid-template-columns:1fr}
  .rcard .seal{grid-row:auto}
}
.site-foot{margin-top:28px; padding-block:18px; border-top:1.5px dashed var(--line); display:grid; gap:10px; justify-items:center; text-align:center}
.site-foot p{margin:0; font-size:14px; color:var(--muted); max-width:60ch}
.threads-link{display:inline-flex; align-items:center; gap:8px; border:2px solid var(--ink); color:var(--ink); background:var(--card); border-radius:999px; padding:10px 20px; font-weight:700; text-decoration:none; min-height:48px}
.threads-link:hover{background:var(--ink); color:var(--card)}
.threads-link:focus-visible{outline:3px solid var(--green); outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
.subchips{display:flex; flex-wrap:wrap; gap:8px}
.subchip{display:inline-grid; gap:2px; border:1.5px solid var(--green); color:var(--green); border-radius:10px; padding:6px 12px; font-family:var(--f-kai); font-size:19px; font-weight:700}
.subchip small{font-family:var(--f-ui); font-size:13px; font-weight:500; color:var(--muted)}
.subtag{display:inline-block; margin-left:8px; font-family:var(--f-ui); font-size:12px; font-weight:700; color:var(--red); border:1.5px solid var(--red); border-radius:6px; padding:0 6px; vertical-align:middle}
.qask{margin:0; font-weight:700; color:var(--green); font-size:18px}
.ex-list .ex-n{margin-top:4px; line-height:1.6}
.rcard .subchips{grid-column:1/-1}
.units{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.units{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 公仔 */
.fig-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.fig-grid.small{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media (max-width:640px){.fig-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{display:grid; gap:4px; justify-items:center; text-align:center; background:var(--card); border:2px solid var(--line); border-radius:18px; padding:10px 10px 12px; min-width:0}
.fig-img{position:relative; width:100%; aspect-ratio:1/1; border-radius:14px; overflow:hidden; background:#fff; display:grid; place-items:center}
.fig-img img{width:100%; height:100%; object-fit:cover}
.fig.locked .fig-img img{filter:brightness(0) opacity(.18)}
.fig.locked .fig-img{background:var(--grid)}
.fig-q{position:absolute; font-family:var(--f-kai); font-size:44px; font-weight:700; color:var(--muted)}
.fig-lv{position:absolute; top:6px; left:6px; background:var(--green); color:#fff; font-size:12px; font-weight:700; border-radius:999px; padding:1px 8px}
.fig-name{font-family:var(--f-kai); font-size:20px; font-weight:700}
.fig.locked .fig-name{color:var(--muted)}
.fig-sub,.fig-cnt{font-size:13px; color:var(--muted)}
.fig-bar{width:100%; height:8px; border-radius:999px; background:var(--grid); overflow:hidden}
.fig-bar i{display:block; height:100%; background:var(--green); border-radius:999px}
.fig.lv2{border-color:var(--green)}
.fig.lv3{border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,138,18,.2)}
.fig.lv3 .fig-lv{background:var(--gold)}
.fig.fresh{animation:pluck .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pluck{0%{transform:translateY(40px) scale(.6); opacity:0}100%{transform:none; opacity:1}}
.fig-wrap{position:relative}
.fig-tag{position:absolute; z-index:2; top:-8px; right:-6px; background:var(--red); color:#fff; font-size:12px; font-weight:700; border-radius:999px; padding:2px 10px; transform:rotate(6deg)}
.fig-toast{display:flex; gap:10px; align-items:center; margin-top:6px; padding:8px; background:var(--card); border:2px dashed var(--gold); border-radius:12px; animation:pluck .6s cubic-bezier(.2,1.6,.4,1)}
.fig-toast img{width:56px; height:56px; object-fit:cover; border-radius:10px; flex:none}
.fig-toast b{display:block; color:var(--gold); font-family:var(--f-kai); font-size:19px}
.fig-strip{display:flex; flex-wrap:wrap; gap:6px}
.fig-strip img{width:52px; height:52px; object-fit:cover; border-radius:12px; border:2px solid var(--line); background:#fff}
.fig-strip img.locked{filter:brightness(0) opacity(.15)}
.fig-progress{font-size:16px} .fig-progress b{font-family:var(--f-kai); font-size:26px; color:var(--red)}
.tab{font-size:16px; padding-inline:4px}
@media (max-width:520px){.tabs{gap:4px}.tab{font-size:14px; padding:9px 2px}}
@media (prefers-reduced-motion: reduce){.fig.fresh,.fig-toast{animation:none}}
.lesson-list{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:6px 16px; font-size:15px}
.lesson-list li{display:flex; gap:8px; padding:4px 8px; border-radius:8px; min-width:0}
.lesson-list li b{color:var(--green); white-space:nowrap}
.lesson-list li.on{background:var(--green-soft)}
</style>

 {t:"擬人",l:8,s:"貪吃的火什麼都想吃，一下子就吞掉了整堆木柴。",n:"火不會「貪吃」，也不會「吞」東西，寫得像人一樣，是擬人。"},
 {t:"疊字",l:8,s:"營火燒得紅通通的，照亮了大家的臉。",n:"「通通」是同一個字連著重複，是疊字。"},

 {t:"類疊",l:8,sub:"類字",s:"小心用火，小心用電，才能平平安安。",n:"「小心用」隔開來重複出現，是類疊中的類字。"},

EXAMPLES.forEach(e=>{
  const labels=new Set([e.t,...(e.no||[])]);
  EXAMPLES.forEach(o=>{if(o!==e&&(o.k.includes(e.k)||e.k.includes(o.k))){labels.add(o.t);(o.no||[]).forEach(x=>labels.add(x))}});
  /* 看得出來的其他修辭也排除，避免學生選了被判錯 */
  if(/(.)\1/.test(e.s)){labels.add("類疊");labels.add("疊字")}
  /* 擬人和轉化、疊字和類疊在同一冊分開教時，互相不當錯誤選項 */
  const PAIRS=[["擬人","轉化"],["疊字","類疊"]];
  PAIRS.forEach(([a,b])=>{if(e.t===a)labels.add(b);if(e.t===b)labels.add(a)});
  if(/？/.test(e.s)) labels.add("設問");
  if(/！/.test(e.s)&&ORDER.includes("感嘆")) labels.add("感嘆");
  if(/像|好像|彷彿|如同|似的|般/.test(e.s)) labels.add("譬喻");
  labels.delete(e.t);
  e.labels=labels;
});

/* ===== 音效 ===== */
let soundOn=store.get("sound",true), actx=null;
function beep(good){
  if(!soundOn) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=good?[660,880]:[220,180];
    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=good?"triangle":"square";
      o.frequency.value=f;g.gain.setValueAtTime(.0001,actx.currentTime+i*.11);
      g.gain.exponentialRampToValueAtTime(good?.18:.08,actx.currentTime+i*.11+.02);
      g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+i*.11+.18);
      o.connect(g).connect(actx.destination);o.start(actx.currentTime+i*.11);o.stop(actx.currentTime+i*.11+.2)});
  }catch(e){}
}
function syncSoundBtn(){const b=$("#soundBtn");b.textContent="音效："+(soundOn?"開":"關");b.setAttribute("aria-pressed",soundOn)}
$("#soundBtn").onclick=()=>{soundOn=!soundOn;store.set("sound",soundOn);syncSoundBtn()};

/* ===== 闖關遊戲 ===== */
let cfg={lessons:LNUMS.slice(),n:10};
let round=null;
function makeName(e){
  const ds=shuffle(ORDER.filter(t=>t!==e.t&&!e.labels.has(t))).slice(0,3);
  return {kind:"name",e,opts:shuffle([e.t,...ds]).map(t=>({label:t,val:t})),answer:e.t,t:e.t,l:e.l};
}
function makeSub(e){
  return {kind:"sub",e,opts:["疑問","激問","提問"].map(t=>({label:t,val:t})),answer:e.sub,t:"設問",l:e.l};
}
function makePractice(p){
  const ord=shuffle([0,1]);
  return {kind:"practice",p,opts:ord.map(i=>({label:esc(p.o[i].s),val:i})),answer:p.a,t:p.t,l:p.l};
}
function poolFor(c){
  const ex=EXAMPLES.filter(e=>c.lessons.includes(e.l));
  const pr=PRACTICE.filter(p=>c.lessons.includes(p.l));
  return {ex,pr};
}
function newRound(fromList){
  let qs;
  if(fromList){qs=shuffle(fromList).map(Q=>Q.kind==="practice"?makePractice(Q.p):Q.kind==="sub"?makeSub(Q.e):makeName(Q.e))}
  else{
    const {ex,pr}=poolFor(cfg);
    const nPr=Math.min(pr.length,Math.round(cfg.n*0.4));
    const pickedPr=shuffle(pr).slice(0,nPr).map(makePractice);
    // 例句題：盡量讓不同修辭輪流出現
    const byType={};shuffle(ex).forEach(e=>(byType[e.t]=byType[e.t]||[]).push(e));
    const exQs=[];let types=shuffle(Object.keys(byType));const need=cfg.n-pickedPr.length;
    while(exQs.length<need&&types.length){
      for(const t of types){if(byType[t].length&&exQs.length<need){const e=byType[t].shift();exQs.push(e.t==="設問"&&e.sub&&Math.random()<.5?makeSub(e):makeName(e))}}
      types=types.filter(t=>byType[t].length);
    }
    qs=shuffle(pickedPr.concat(exQs));
  }
  round={qs,i:0,score:0,combo:0,best:0,results:[],newFigs:[],lvUps:[],answered:false};
  renderPlay();
}
function renderSetup(){
  const best=store.get("best",null);
  const {ex,pr}=poolFor(cfg); const n=Math.min(cfg.n,ex.length+pr.length);
  $("#stage").innerHTML=`<div class="box setup">
    <div><h2>選好範圍，開始闖關！</h2><p class="lead">課別範圍對應${GRADE.long||GRADE.label.replace("翰林","翰林版")}，例句和題目都是老師媽咪原創。</p></div>
    <div><label class="lbl" id="lbl-l">要複習哪幾課？</label>
      <div class="chips" role="group" aria-labelledby="lbl-l" id="setL">${LNUMS.map(l=>`<button class="chip" aria-pressed="${cfg.lessons.includes(l)}" data-l="${l}">${LN(l)}</button>`).join("")}
      <button class="chip" data-all="1" aria-pressed="false">全選</button></div></div>
    <div class="row"><button class="big-btn" id="startBtn" ${n?"":"disabled"}>開始闖關（${n} 題）</button>
      <span class="best">${best!==null?`最高紀錄：${best} 分`:"還沒有紀錄，來挑戰吧！"}</span></div>
    <div><label class="lbl">我的修辭公仔（答對就能收集）</label>${figStrip()}</div>
  </div>`;
  $("#setL").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    if(b.dataset.all){cfg.lessons=LNUMS.slice()}
    else{const l=+b.dataset.l;cfg.lessons=cfg.lessons.includes(l)?cfg.lessons.filter(x=>x!==l):[...cfg.lessons,l].sort((a,b)=>a-b);if(!cfg.lessons.length)cfg.lessons=[l]}
    renderSetup()});
  $("#startBtn").onclick=()=>newRound();
}
function stampCard(got,fresh){
  return `<div class="stamp-card">${ORDER.map(t=>`<div class="stamp ${got.has(t)?"got":""} ${fresh.has(t)?"new":""}"><div class="seal" aria-hidden="true">${T[t].seal}</div>${t}</div>`).join("")}</div>`;
}
function gradesRow(){
  return `<div class="grades" aria-label="答題紀錄">${round.qs.map((_,k)=>{
    const r=round.results[k];const mark=r===undefined?"":r.ok?"○":"✗";
    return `<i class="${k===round.i&&!round.done?"now":""}"><span>${mark}</span></i>`}).join("")}</div>`;
}
function qText(Q){
  if(Q.kind==="practice") return {kind:`練習題・${LN(Q.l)}`,head:`<p class="qsent">${Q.p.q}</p>`};
  if(Q.kind==="sub") return {kind:`例句・${LT(Q.l)}`,head:`<p class="qsent">${esc(Q.e.s)}</p><p class="qask">這句設問是哪一種？</p>`};
  return {kind:`例句・${LT(Q.l)}`,head:`<p class="qsent">${esc(Q.e.s)}</p><p class="qask">這句用了哪一種修辭？</p>`};
}
function renderPlay(){
  const Q=round.qs[round.i], tx=qText(Q);
  $("#stage").innerHTML=`<div class="box qbox">
    <div class="hud">${gradesRow()}<div class="combo" id="combo">${round.combo>=2?`連續答對 ${round.combo} 題！`:""}</div></div>
    <div class="qkind">第 ${round.i+1} 題・${tx.kind}</div>${tx.head}
    <div class="opts ${Q.kind==="practice"?"long":""}" id="opts">${Q.opts.map((o,k)=>`<button class="opt" id="opt${k}" data-k="${k}">${o.label}</button>`).join("")}</div>
    <div id="fb"></div></div>`;
  $("#opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}
function explain(Q){
  if(Q.kind==="practice"){const x=Q.p.o[Q.p.a].x;return `正確答案：${esc(Q.p.o[Q.p.a].s)}${x?`（${esc(x)}）`:""}`}
  return `解析：${esc(Q.e.n)}`;
}
function answer(k){
  if(round.answered) return; round.answered=true;
  const Q=round.qs[round.i], pick=Q.opts[k], ok=pick.val===Q.answer;
  round.results[round.i]={ok,Q,pickLabel:pick.label};
  let figNote="";
  if(ok){round.score++;round.combo++;round.best=Math.max(round.best,round.combo);figNote=gainFig(Q.t)}else round.combo=0;
  beep(ok);
  $("#opts").querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;
    if(Q.opts[j].val===Q.answer)b.classList.add("right");else if(j===k)b.classList.add("wrong");else b.classList.add("fade")});
  const ansName=Q.kind==="practice"?"":`，答案是「${Q.answer}」`;
  $("#fb").innerHTML=`<div class="feedback ${ok?"good":"bad"}" role="status">
      <strong>${ok?["答對了！","好厲害！","偵探眼力一流！","完全正確！"][Math.floor(Math.random()*4)]:`再想想${ansName}`}</strong>
      <p>${explain(Q)}</p>${figNote}</div>
    <div class="next-row"><button class="big-btn" id="nextBtn">${round.i+1<round.qs.length?"下一題":"看成績"}</button></div>`;
  $("#combo").textContent=round.combo>=2?`連續答對 ${round.combo} 題！`:"";
  document.querySelectorAll(".grades i")[round.i].querySelector("span").textContent=ok?"○":"✗";
  $("#nextBtn").onclick=next; $("#nextBtn").focus({preventScroll:true});
}
function next(){
  round.answered=false; round.i++;
  if(round.i<round.qs.length){renderPlay();window.scrollTo({top:0,behavior:"smooth"})}
  else finish();
}
function finish(){
  round.done=true;
  const total=round.qs.length, pct=round.score/total, score=Math.round(pct*100);
  const stars=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
  const best=store.get("best",null); if(best===null||score>best) store.set("best",score);

  const wrong=round.results.filter(r=>!r.ok);
  const msg=stars===3?"太棒了，你是修辭神探！":stars===2?"很不錯！再複習一下錯的題目就更完美了。":stars===1?"有進步的空間，先看看總整理再挑戰一次吧！":"別灰心，先到「修辭教室」複習，再回來挑戰！";
  $("#stage").innerHTML=`<div class="box" style="display:grid;gap:18px">
    <div class="score-line"><div class="score">${score}<small> 分</small></div>
      <div><div class="stars" aria-label="${stars} 顆星">${[0,1,2].map(i=>i<stars?"★":'<span class="off">★</span>').join("")}</div>
      <div>答對 ${round.score} / ${total} 題・最多連續答對 ${round.best} 題</div></div></div>
    <p style="margin:0;font-family:var(--f-kai);font-size:22px">${msg}</p>
    ${gradesRow()}
    ${roundFigs()}
    <div><h3 style="margin-bottom:8px">錯題本</h3>${wrong.length?`<ul class="wrong-list">${wrong.map(r=>{
      const Q=r.Q;const head=Q.kind==="practice"?Q.p.q:esc(Q.e.s);
      return `<li><span class="ex-s">${head}</span><p>${Q.kind==="practice"?"":`你選「${r.pickLabel}」，正確答案是「<b>${Q.answer}</b>」。`}${explain(Q)}</p></li>`}).join("")}</ul>`:'<p class="empty">全部答對，沒有錯題！</p>'}</div>
    <div class="row">${wrong.length?'<button class="big-btn" id="retryWrong">只練錯的題目</button>':""}
      <button class="${wrong.length?"ghost-btn":"big-btn"}" id="again">再玩一次</button>
      <button class="ghost-btn" id="toSetup">換範圍</button>
      <button class="ghost-btn" id="toReview">回總整理</button></div>
    <p style="margin:0;font-size:15px;color:var(--muted)">喜歡這個遊戲嗎？<a href="https://www.threads.com/@teacher_liujikan" target="_blank" rel="noopener" style="color:var(--red);font-weight:700">追蹤老師媽咪的 Threads</a>，看更多複習小遊戲。</p>
  </div>`;
  if(wrong.length) $("#retryWrong").onclick=()=>newRound(wrong.map(r=>r.Q));
  $("#again").onclick=()=>newRound();
  $("#toSetup").onclick=()=>{round=null;renderSetup()};
  $("#toReview").onclick=()=>{showTab("review");window.scrollTo({top:0})};
  window.scrollTo({top:0,behavior:"smooth"});
}

 "類疊":{name:"疊疊三兄弟",line:"三個長得一模一樣，說話也一句接一句重複。"},
 "映襯":{name:"日月寶寶",line:"一個白天、一個夜晚，站在一起更顯眼。"},
 "設問":{name:"問問",line:"頭上冒著問號，最愛丟問題給你想。"},
 "頂真":{name:"接接",line:"和好朋友手牽手，一句接著一句不斷線。"},
 "借代":{name:"小國王",line:"戴著王冠，用一個特徵就能代表一整個人。"},
 "層遞":{name:"爬爬",line:"一階一階往上爬，越爬越高。"},
 "象徵":{name:"天使",line:"拿著橄欖枝，代表和平與希望。"},
 "雙關":{name:"桃桃",line:"一句話藏著兩種意思，最會說諧音笑話。"},
 "引用":{name:"書書",line:"抱著一本書，名言佳句信手拈來。"}
};
Object.assign(FIGS,EXTRA_FIGS);
const LV=[{n:1,label:"發芽",star:"★"},{n:5,label:"長葉",star:"★★"},{n:10,label:"開花",star:"★★★"}];
function figCounts(){return store.get("figs",{})}
function figLv(c){let lv=0;LV.forEach((x,i)=>{if(c>=x.n)lv=i+1});return lv}
function gainFig(t){
  const c=figCounts(), before=c[t]||0; c[t]=before+1; store.set("figs",c);
  const lb=figLv(before), la=figLv(c[t]), f=FIGS[t];
  if(lb===0){round.newFigs.push(t);return `<div class="fig-toast"><img src="${FIG_IMG[t]}" alt=""><div><b>獲得新公仔！</b>${t}・${f.name}</div></div>`}
  if(la>lb){round.lvUps.push(t);return `<div class="fig-toast"><img src="${FIG_IMG[t]}" alt=""><div><b>${f.name}升級了！</b>Lv${la}・${LV[la-1].label}</div></div>`}
  return "";
}
function figCard(t,c,fresh){
  const lv=figLv(c), f=FIGS[t];
  if(!lv) return `<div class="fig locked"><div class="fig-img"><img src="${FIG_IMG[t]}" alt=""><span class="fig-q">?</span></div><div class="fig-name">？？？</div><div class="fig-sub">${t}・答對 1 題解鎖</div></div>`;
  const nextN=LV[lv]?LV[lv].n:null;
  return `<div class="fig lv${lv} ${fresh?"fresh":""}"><div class="fig-img"><img src="${FIG_IMG[t]}" alt="${t}公仔：${f.name}"><span class="fig-lv">Lv${lv}</span></div>
    <div class="fig-name">${f.name}</div><div class="fig-sub">${t}・${LV[lv-1].label} ${LV[lv-1].star}</div>
    <div class="fig-bar" aria-label="答對 ${c} 次"><i style="width:${nextN?Math.min(100,c/nextN*100):100}%"></i></div>
    <div class="fig-cnt">${nextN?`答對 ${c} / ${nextN} 次升級`:`答對 ${c} 次・滿級！`}</div></div>`;
}
function figStrip(){
  const c=figCounts(), got=ORDER.filter(t=>c[t]);
  return `<div class="fig-strip">${ORDER.map(t=>`<img class="${c[t]?"":"locked"}" src="${FIG_IMG[t]}" alt="${c[t]?FIGS[t].name:"未解鎖"}">`).join("")}</div>
    <p class="best" style="margin:6px 0 0">已收集 ${got.length} / ${ORDER.length} 隻・<a href="#figs" id="toFigs" style="color:var(--red);font-weight:700">看公仔圖鑑</a></p>`;
}
function roundFigs(){
  const items=[...round.newFigs.map(t=>[t,"新公仔"]),...round.lvUps.filter(t=>!round.newFigs.includes(t)).map(t=>[t,"升級"])];
  const c=figCounts();
  return `<div><h3 style="margin-bottom:8px">這一輪的公仔</h3>${items.length?`<div class="fig-grid small">${items.map(([t,tag])=>`<div class="fig-wrap"><span class="fig-tag">${tag}</span>${figCard(t,c[t]||0,true)}</div>`).join("")}</div>`:'<p class="empty">這一輪沒有新公仔，答對更多題就能收集和升級喔！</p>'}
    <p class="best" style="margin:8px 0 0">已收集 ${ORDER.filter(t=>c[t]).length} / ${ORDER.length} 隻・<a href="#figs" id="toFigs" style="color:var(--red);font-weight:700">看公仔圖鑑</a></p></div>`;
}
function renderFigs(){
  const c=figCounts(), got=ORDER.filter(t=>c[t]).length, full=ORDER.filter(t=>figLv(c[t]||0)===3).length;
  $("#figStage").innerHTML=`<div class="box" style="display:grid;gap:14px">
    <div><h2>修辭公仔圖鑑</h2><p class="lead">在闖關遊戲答對一題，就能解鎖那種修辭的公仔。同一種答對 5 次會長葉、10 次會開花！</p></div>
    <div class="fig-progress"><b>${got}</b> / ${ORDER.length} 隻已收集・<b>${full}</b> 隻開花滿級</div>
    <div class="fig-grid">${ORDER.map(t=>figCard(t,c[t]||0,false)).join("")}</div>
    <div class="row"><button class="big-btn" id="figPlay">去闖關收集公仔</button></div></div>`;
  $("#figPlay").onclick=()=>{showTab("game");round=null;renderSetup();window.scrollTo({top:0})};
}
document.addEventListener("click",e=>{if(e.target&&e.target.id==="toFigs"){e.preventDefault();showTab("figs");renderFigs();window.scrollTo({top:0})}});

/* ===== 右上角 QR Code：自動抓這個網頁的網址 ===== */
const PAGE_URL="";
function renderQR(){
  try{
    const url=PAGE_URL||(/^https?:/.test(location.href)?location.href.split("#")[0]:"");
    if(!url||typeof qrcode==="undefined") return;
    const q=qrcode(0,"M"); q.addData(url); q.make();
    $("#qrImg").innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true});
    $("#qrBox").hidden=false;
  }catch(e){}
}

/* ===== 啟動 ===== */
function start(data){
  syncSoundBtn(); renderQR(); renderLearnHome(); renderReview(); renderSetup(); renderFigs();
  if(location.hash==="#figs") showTab("figs");
  if(data&&data.tab) showTab(data.tab);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot){try{hot.snapshot(()=>({tab:state.tab}))}catch(e){}}
if(hot&&hot.ready) hot.ready(start); else start((hot&&hot.data)||{});
</script>
</body>
